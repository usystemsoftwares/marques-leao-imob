steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '--build-arg'
      - 'EMPRESA_ID=${_EMPRESA_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_EMPRESA_ID=${_EMPRESA_ID}'
      - '--build-arg'
      - 'BACKEND_API_URI=${_BACKEND_API_URI}'
      - '--build-arg'
      - 'NEXT_PUBLIC_BACKEND_API_URI=${_BACKEND_API_URI}'
      - '--build-arg'
      - 'NEXT_PUBLIC_MAPS_API_KEY=${_MAPS_API_KEY}'
      - '--build-arg'
      - 'GOOGLE_PLACES_API_KEY=${_GOOGLE_PLACES_API_KEY}'
      - '--build-arg'
      - 'GOOGLE_PLACE_ID=${_GOOGLE_PLACE_ID}'
      - '-t'
      - 'us-central1-docker.pkg.dev/crmocto-prod/sites/marques-${_SERVICE_SUFFIX}:${_TAG}'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/crmocto-prod/sites/marques-${_SERVICE_SUFFIX}:${_TAG}'

  # O domínio é servido pelo LB do crmocto-prod; o serviço lá já tem SA, env e ingress
  # configurados, então só trocamos a imagem.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'marques-${_SERVICE_SUFFIX}'
      - '--project=crmocto-prod'
      - '--region=us-central1'
      - '--image=us-central1-docker.pkg.dev/crmocto-prod/sites/marques-${_SERVICE_SUFFIX}:${_TAG}'
      - '--update-env-vars=EMPRESA_ID=${_EMPRESA_ID},NEXT_PUBLIC_EMPRESA_ID=${_EMPRESA_ID},BACKEND_API_URI=${_BACKEND_API_URI},NEXT_PUBLIC_BACKEND_API_URI=${_BACKEND_API_URI},GOOGLE_PLACES_API_KEY=${_GOOGLE_PLACES_API_KEY},GOOGLE_PLACE_ID=${_GOOGLE_PLACE_ID}'
      - '--quiet'

images:
  - 'us-central1-docker.pkg.dev/crmocto-prod/sites/marques-${_SERVICE_SUFFIX}:${_TAG}'

substitutions:
  _EMPRESA_ID: 'default'
  _BACKEND_API_URI: 'https://api.smtximob.com'
  _SERVICE_SUFFIX: 'template'
  _TAG: 'latest'
  _MAPS_API_KEY: ''
  _GOOGLE_PLACES_API_KEY: ''
  _GOOGLE_PLACE_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
